name: Release

# Tag-triggered release: push a vX.Y.Z tag and GoReleaser builds the
# cross-platform binaries + checksums and publishes them to the GitHub
# Release. pngr-ui's install.sh downloads those assets.
#
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # GoReleaser needs full history + tags for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          # Creates the GitHub Release + uploads assets in this repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Classic PAT (repo scope) that can push the formula to the separate
          # marfx000/homebrew-tap repo; the default GITHUB_TOKEN can't write
          # cross-repo. See the `brews` block in .goreleaser.yaml.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
