# GoReleaser config for the pngr CLI.
#
# Cuts cross-platform binaries on a git tag (vX.Y.Z) and publishes them to the
# GitHub Release. Asset names are pinned to match what pngr-ui's install.sh
# expects: pngr_<os>_<arch>.tar.gz + pngr_checksums.txt, with the `pngr`
# binary at the archive root.
#
# Local dry run (no publish):  goreleaser release --snapshot --clean
version: 2

project_name: pngr

before:
  hooks:
    - go mod tidy

builds:
  - id: pngr
    # main package is at the repo root.
    main: .
    binary: pngr
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      # main.version is the var in version.go; -s -w strip the symbol table.
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: pngr
    # install.sh fetches pngr_<os>_<arch>.tar.gz, so the name must be exactly
    # that — no version in the filename (it pulls from /releases/latest/).
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    files:
      - README.md
      - LICENSE

checksum:
  # install.sh looks for pngr_checksums.txt.
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256

snapshot:
  # Rolling main builds aren't tagged, so embed an identifiable version
  # (e.g. `main-a1b2c3d`) into `pngr version` instead of a bogus semver.
  version_template: "main-{{ .ShortCommit }}"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: marfx000
    name: pngr-cli
  draft: false
  prerelease: auto

brews:
  # Publishes a Homebrew formula to the dedicated tap repo on each stable tag,
  # so users can `brew install marfx000/tap/pngr`. GoReleaser commits a
  # Formula/pngr.rb that points at the just-released darwin/linux archives.
  - name: pngr
    repository:
      owner: marfx000
      # The repo MUST be named `homebrew-tap`; Homebrew strips the `homebrew-`
      # prefix, so the tap is referenced as `marfx000/tap`.
      name: homebrew-tap
      # The default GITHUB_TOKEN is scoped to pngr-cli only and can't push to a
      # separate repo, so the release workflow injects a classic PAT (repo
      # scope) as HOMEBREW_TAP_GITHUB_TOKEN.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://pngr.dev"
    description: "CLI and MCP server for pngr.dev — manage URL monitors from the terminal"
    license: "MIT"
    # auto = skip pushing the formula on snapshots and prereleases (e.g. RC
    # tags), so only real vX.Y.Z releases update the tap.
    skip_upload: auto
    commit_author:
      name: goreleaser-bot
      email: goreleaser-bot@pngr.dev
    install: |
      bin.install "pngr"
    test: |
      system "#{bin}/pngr", "version"
